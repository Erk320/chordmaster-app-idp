<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="url(#accent)" stroke-width="10" opacity="0.4"/>
  
  <!-- Outer Gold Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#gold)" stroke-width="12" opacity="0.85"/>
  
  <!-- Fretboard Grid -->
  <g stroke="#94a3b8" stroke-width="6" opacity="0.7">
    <line x1="160" y1="180" x2="352" y2="180" />
    <line x1="160" y1="220" x2="352" y2="220" />
    <line x1="160" y1="260" x2="352" y2="260" />
    <line x1="160" y1="300" x2="352" y2="300" />
    <line x1="160" y1="340" x2="352" y2="340" />
  </g>
  <g stroke="url(#gold)" stroke-width="8">
    <line x1="180" y1="160" x2="180" y2="360" />
    <line x1="218" y1="160" x2="218" y2="360" />
    <line x1="256" y1="160" x2="256" y2="360" />
    <line x1="294" y1="160" x2="294" y2="360" />
    <line x1="332" y1="160" x2="332" y2="360" />
  </g>
  
  <!-- Finger Dots -->
  <circle cx="218" cy="260" r="18" fill="#38bdf8" />
  <circle cx="256" cy="220" r="18" fill="#38bdf8" />
  <circle cx="294" cy="300" r="18" fill="#38bdf8" />
  
  <!-- Musical Note Accent Top Right -->
  <path d="M 370 110 L 410 100 L 410 160 A 18 18 0 1 1 392 142 L 392 120 L 370 125 Z" fill="url(#gold)"/>
